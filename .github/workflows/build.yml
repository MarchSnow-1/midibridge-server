name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate release notes
        run: |
          npx auto-changelog-plus --starting-version ${{ github.ref_name }}
          sed -i '1,4d' CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  build:
    runs-on: ${{ matrix.os }}
    needs: changelog
    if: always() && (needs.changelog.result == 'success' || needs.changelog.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== Windows =====
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows-amd64
            ext: .exe

          # ===== Linux =====
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux-amd64
            ext: ""

          - os: ubuntu-22.04
            goos: linux
            goarch: arm64
            platform: linux-arm64
            ext: ""
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++

          - os: ubuntu-22.04
            goos: linux
            goarch: arm
            goarm: "7"
            platform: linux-armv7
            ext: ""
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++

          # ===== macOS =====
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            platform: darwin-amd64
            ext: ""

          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin-arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth for the toolchain version.
          go-version-file: src/go.mod

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "${{ matrix.goarch }}" in
            arm64|arm)
              if [ "${{ matrix.goarch }}" = "arm64" ]; then
                DEB_ARCH=arm64
                CROSS_CC="gcc-aarch64-linux-gnu g++-aarch64-linux-gnu"
              else
                DEB_ARCH=armhf
                CROSS_CC="gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf"
              fi

              sudo sed -i 's/^deb /deb [arch=amd64] /g; s/^deb-src /deb-src [arch=amd64] /g' /etc/apt/sources.list

              # Ubuntu Ports
              CODE=$(lsb_release -cs)
              for suite in "$CODE" "$CODE-updates" "$CODE-security"; do
                echo "deb [arch=${DEB_ARCH}] http://ports.ubuntu.com/ubuntu-ports/ ${suite} main restricted universe multiverse" \
                  | sudo tee -a /etc/apt/sources.list
              done

              sudo dpkg --add-architecture "$DEB_ARCH"
              sudo apt-get update -q
              sudo apt-get install -y \
                libasound2-dev \
                libasound2-dev:"$DEB_ARCH" \
                gcc g++ \
                $CROSS_CC
              ;;
            *)
              sudo apt-get update -q
              sudo apt-get install -y libasound2-dev gcc g++
              ;;
          esac

      - name: Vulnerability scan
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build
        working-directory: src
        shell: bash
        run: |
          export CGO_ENABLED=1
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          [ -n "${{ matrix.goarm }}" ] && export GOARM=${{ matrix.goarm }}

          [ -n "${{ matrix.cc }}" ]  && export CC=${{ matrix.cc }}
          [ -n "${{ matrix.cxx }}" ] && export CXX=${{ matrix.cxx }}

          # 静态链接策略按目标系统区分，原因是各平台的 C++ 运行时归属不同
          # Windows 的 mingw 运行库不是系统组件，动态链接会让产物在干净机器上直接报缺少 DLL
          # Windows 因此整包静态链接 libgcc、libstdc++ 与 winpthread
          # Linux 只静态链接 libgcc 与 libstdc++，libc 与 libasound 保持动态，这是链接系统音频栈的前提
          # macOS 的 libc++ 与各 Framework 由系统提供，不需要额外参数
          #
          # The static linking policy differs per target because the C++ runtime belongs to a different party on each platform
          # The mingw runtime on Windows is not an OS component, so a dynamic link makes the artifact fail with a missing DLL on a clean machine
          # Windows therefore links libgcc, libstdc++ and winpthread statically as a whole
          # Linux links only libgcc and libstdc++ statically and keeps libc and libasound dynamic, which is what linking against the system audio stack requires
          # macOS ships libc++ and the frameworks with the OS, so it needs no extra flag
          case "${{ matrix.goos }}" in
            windows) EXTLDFLAGS="-extldflags '-static'" ;;
            linux)   EXTLDFLAGS="-extldflags '-static-libgcc -static-libstdc++'" ;;
            *)       EXTLDFLAGS="" ;;
          esac

          go build \
            -ldflags "-X main.version=${{ github.ref_name }} ${EXTLDFLAGS}" \
            -o ../dist/midibridge-server${{ matrix.ext }} \
            .

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          mv dist/midibridge-server${{ matrix.ext }} \
             dist/MIDIBridge-Server-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}

      - name: Verify runtime dependencies
        # 产物只应依赖目标系统自带的库，出现额外运行库说明上面的静态链接参数没有生效
        # 这里读取真实产物，而不是相信构建参数
        #
        # The artifact should depend only on libraries shipped with the target OS, so an extra runtime library means the static linking flags above did not take effect
        # The check reads the real artifact instead of trusting the build flags
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/MIDIBridge-Server-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}"
          echo "checking ${BIN}"
          case "${{ matrix.goos }}" in
            windows)
              OBJDUMP=$(command -v objdump || true)
              if [ -z "$OBJDUMP" ]; then
                OBJDUMP="$(dirname "$(command -v "$(go env CC)")")/objdump"
              fi
              if [ ! -x "$OBJDUMP" ]; then
                echo "::error::cannot locate objdump to inspect ${BIN}"
                exit 1
              fi
              DEPS=$("$OBJDUMP" -p "$BIN" | sed -n 's/^[[:space:]]*DLL Name: //p')
              ;;
            linux)
              DEPS=$(readelf -d "$BIN" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
              ;;
            darwin)
              DEPS=$(otool -L "$BIN" | tail -n +2 | awk '{print $1}')
              ;;
          esac
          echo "${DEPS}"
          if [ -z "${DEPS}" ]; then
            echo "::error::no runtime dependency was read from ${BIN}, so the inspection itself failed"
            exit 1
          fi
          BAD=$(printf '%s\n' "${DEPS}" | grep -Ei '^(libgcc|libstdc\+\+|libwinpthread)' || true)
          if [ -n "${BAD}" ]; then
            echo "::error::${BIN} depends on a runtime that is not part of the OS: ${BAD}"
            exit 1
          fi

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release/data
          cp dist/MIDIBridge-Server-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }} release/
          cd release && zip -r \
            ../MIDIBridge-Server-${{ github.ref_name }}-${{ matrix.platform }}.zip .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\data | Out-Null
          Copy-Item "dist\MIDIBridge-Server-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}" release\
          Compress-Archive -Path release\* `
            -DestinationPath "MIDIBridge-Server-${{ github.ref_name }}-${{ matrix.platform }}.zip"

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: MIDIBridge-Server-${{ github.ref_name }}-${{ matrix.platform }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}